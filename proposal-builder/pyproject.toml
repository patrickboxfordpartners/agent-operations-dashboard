[project]
name = "proposal-builder"
version = "0.1.0"
description = "Unified proposal builder for AI automation and web development services"
requires-python = ">=3.11"

dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "email-validator>=2.0.0",
]

# Optional dependencies for production use
[project.optional-dependencies]
pdf = [
    "reportlab>=4.0.0",
    "weasyprint>=60.0",
]
esignature = [
    "docusign-esign>=3.28.0",
]
