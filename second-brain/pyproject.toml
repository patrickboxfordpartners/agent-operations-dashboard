[project]
name = "second-brain"
version = "0.1.0"
description = "Personal knowledge management system for consulting work"
requires-python = ">=3.11"

dependencies = [
    "anthropic>=0.40.0",
    "voyageai>=0.2.0",
    "pinecone-client>=3.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    "watchdog>=4.0.0",
    "rich>=13.7.0",
    "click>=8.1.7",
    "langfuse>=2.0.0",
    "redis>=5.0.0",
    "aiofiles>=23.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
]

[project.scripts]
brain = "second_brain.query.cli:cli"
brain-server = "second_brain.query.mcp_server:main"
brain-watch = "second_brain.ingestion.watcher:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ['py311']
