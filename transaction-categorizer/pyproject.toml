[project]
name = "transaction-categorizer"
version = "0.1.0"
description = "AI-powered transaction categorization & reconciliation"
requires-python = ">=3.11"

dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
]

# Optional dependencies for production use
[project.optional-dependencies]
production = [
    "plaid-python>=16.0.0",
    "intuit-oauth>=1.2.4",
    "xero-python>=5.0.0",
]
